name: Qualify and publish LiteLLM Gateway

on:
  workflow_dispatch:
    inputs:
      reuse_image:
        description: Existing qualified image pin as JSON when production inputs are unchanged
        type: string
        required: false
      expected_source_sha:
        description: Full commit SHA of the selected LiteLLM Gateway ref
        type: string
        required: true

permissions:
  contents: read

jobs:
  application:
    name: Qualify the upstream and runtime inputs
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      stage: ${{ steps.version.outputs.stage }}
      production_identity: ${{ steps.version.outputs.production_identity }}
      reuse_digest: ${{ steps.version.outputs.reuse_digest }}
      build_source_revision: ${{ steps.version.outputs.build_source_revision }}
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - name: Verify dispatch SHA
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ||
                "$GITHUB_SHA" != "${EXPECTED_SOURCE_SHA,,}" ]]; then
            echo 'The dispatch ref does not resolve to expected_source_sha.' >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout and upstream
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SOURCE_SHA,,}" ]]
          [[ -f Containerfile ]]
          qualification_dir=$(mktemp -d "$RUNNER_TEMP/litellm-qualification.XXXXXXXX")
          set -euo pipefail
          output=$qualification_dir
          index=bc803c88c244d6193b0f40bffad1124c624109513e56332b03c20d121a9546fb
          amd64=ec96da9f0c6286523a1f7646ecc8991c2455fb9b32cd24d19f9d237ff17ce6cf
          arm64=66d944d56370313bcf3bed9bfdee91d7f199122e76b194be460fc8661ba85711
          source=e926084212ab2eb234c58840d741b3c62c35911b
          token=$(curl -q -fsS 'https://ghcr.io/token?scope=repository:berriai/litellm:pull' |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          for ref in "sha256:$index" "sha256:$amd64" "sha256:$arm64" v1.104.0-rc.2; do
            curl -q -fsS --retry 2 --max-time 45 --proto '=https' -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/berriai/litellm/manifests/$ref" -o "$output/${ref#sha256:}.json"
          done
          (
            cd "$output"
            printf '%s  %s\n' "$index" "$index.json" "$index" v1.104.0-rc.2.json \
              "$amd64" "$amd64.json" "$arm64" "$arm64.json" | sha256sum --check
          )
          python3 - "$output/$index.json" "$amd64" "$arm64" <<'PYTHON'
          import json
          import sys

          with open(sys.argv[1]) as file:
              index = json.load(file)
          assert index["mediaType"] == "application/vnd.oci.image.index.v1+json"
          platforms = {d["platform"]["architecture"]: d["digest"]
                       for d in index["manifests"] if d["platform"]["os"] == "linux"}
          assert platforms == {"amd64": "sha256:" + sys.argv[2], "arm64": "sha256:" + sys.argv[3]}
          PYTHON
          curl -q -fsS --retry 2 --max-time 45 --proto '=https' \
            "https://raw.githubusercontent.com/BerriAI/litellm/$source/LICENSE" -o "$output/LiteLLM-LICENSE"
          cmp licenses/LiteLLM-LICENSE "$output/LiteLLM-LICENSE"
          printf 'upstream_version=v1.104.0-rc.2 upstream_source=%s upstream_index=sha256:%s upstream_amd64=sha256:%s upstream_arm64=sha256:%s\n' "$source" "$index" "$amd64" "$arm64"
          printf 'QUALIFICATION_DIR=%s\n' "$qualification_dir" >> "$GITHUB_ENV"


      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ inputs.reuse_image == '' }}
        with:
          node-version: '24.20.0'
          package-manager-cache: false

      - name: Resolve the artifact version
        id: version
        shell: bash
        env:
          REUSE_PIN: ${{ inputs.reuse_image }}
          PRODUCTION_PATHS: "[\"Containerfile\",\"config\",\"entrypoint.sh\",\"LICENSE\",\"licenses\"]"
          INITIAL_IMPORT: ""
        run: |
          mapfile -t paths < <(jq -er '.[]' <<< "$PRODUCTION_PATHS")
          workflow_json() {
            git show "$1:$2" | yq -p yaml -o json '.'
          }
          production_tree() {
            local source="$1"
            {
              git ls-tree -r "$source" -- "${paths[@]}" | sed '/_test\.go$/d' || return
              workflow_json "$source" .github/workflows/qualify.yml |
                jq -ce '.jobs.container as $job | [$job."runs-on", ($job.steps[] | select(.id == "assemble") | {shell,run,env})] | select(length == 2)' || return
            } | sha256sum | cut -d ' ' -f1
          }
          identity="$(production_tree "$GITHUB_SHA")"
          printf 'production_identity=sha256:%s\n' "$identity" >> "$GITHUB_OUTPUT"
          release_branch="$GITHUB_REF_NAME"
          stable='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          version_pattern="^${stable}$"
          stage=stable
          if [[ "$release_branch" != master ]]; then
            stage=snapshot
            # Give each distinct input set its own prerelease channel. This
            # also separates it from the earlier pilot snapshots in GHCR.
            channel="snapshot-${identity:0:16}"
            release_branch="$channel"
            version_pattern="^${stable}-${channel}\.[1-9][0-9]*$"
          fi
          printf 'stage=%s\n' "$stage" >> "$GITHUB_OUTPUT"

          if [[ -n "$REUSE_PIN" ]]; then
            build_source="$(jq -er '.buildSourceRevision | select(test("^[a-f0-9]{40}$"))' <<< "$REUSE_PIN")"
            digest="$(jq -er '.imageDigest | select(test("^sha256:[a-f0-9]{64}$"))' <<< "$REUSE_PIN")"
            version="$(jq -er .version <<< "$REUSE_PIN")"
            [[ "$(production_tree "$build_source")" == "$identity" ]]
            if [[ "$stage" == stable ]]; then
              [[ "$version" =~ ^${stable}$ ]]
            else
              [[ "$version" =~ ^${stable}-[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*$ ]]
            fi
            printf 'version=%s\nbuild_source_revision=%s\nreuse_digest=%s\n' \
              "$version" "$build_source" "$digest" >> "$GITHUB_OUTPUT"
            exit
          fi
          printf 'build_source_revision=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

          mapfile -t existing < <(git tag --points-at "$GITHUB_SHA" | awk '/^v/ {print substr($0,2)}')
          for version in "${existing[@]}"; do
            if [[ "$version" =~ $version_pattern ]]; then
              printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
              exit
            fi
          done

          lock_root="$(mktemp -d "$RUNNER_TEMP/semantic-release.XXXXXXXX")"
          trusted=https://raw.githubusercontent.com/pandops/flowai-team-registry/c18e7cdde5d5b976f549d1dc486f60776cbb8718/.github/semantic-release
          for file in package.json package-lock.json; do
            curl -q --fail --silent --show-error --proto '=https' --max-time 30 "$trusted/$file" -o "$lock_root/$file"
          done
          (cd "$lock_root" && sha256sum --check <<'LOCKS'
          891ec3a55b9fccf0b49fe0ac0a98f9e9fd5bbd7f1743e0f0e51d6286a178d16b  package.json
          aa53698b9420885d999a383abe2f5fafa453bd5aa938dc9ff3ce3e1ef42551a9  package-lock.json
          LOCKS
          npm ci --ignore-scripts --no-audit --no-fund)

          mirror="$RUNNER_TEMP/version.git"
          metadata="$RUNNER_TEMP/version-metadata"
          git clone --quiet --bare --shared "$GITHUB_WORKSPACE" "$mirror"
          git -C "$mirror" update-ref "refs/heads/$release_branch" "$GITHUB_SHA"
          if [[ "$release_branch" != master ]]; then
            git -C "$mirror" update-ref refs/heads/master "$(git rev-parse refs/remotes/origin/master)"
          fi
          git init --quiet --initial-branch="$release_branch" "$metadata"
          git -C "$metadata" remote add origin "$mirror"
          git -C "$metadata" fetch --quiet --tags origin "refs/heads/$release_branch:refs/version-source"
          git -C "$metadata" update-ref "refs/heads/$release_branch" "$GITHUB_SHA"

          jq -n --arg branch "$release_branch" --arg header "$INITIAL_IMPORT" '{
            branches: (["master"] + if $branch == "master" then [] else [{name:$branch, prerelease:$branch, channel:$branch}] end),
            plugins: [["@semantic-release/commit-analyzer",
                       {releaseRules: (if $header == "" then [] else [{header:$header,release:"minor"}] end)}]],
            tagFormat: "v${version}"
          }' > "$metadata/.releaserc.json"
          log="$RUNNER_TEMP/semantic-release.log"
          (
            cd "$metadata"
            env -i PATH="$PATH" HOME="$metadata" LANG=C.UTF-8 NO_COLOR=1 \
              GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 \
              "$lock_root/node_modules/.bin/semantic-release" --dry-run --no-ci --repository-url "$mirror"
          ) 2>&1 | tee "$log"
          version="$(sed -n 's/^.*[Tt]he next release version is //p' "$log")"
          [[ "$version" =~ $version_pattern ]]
          grep -Fq "Skip v$version tag creation in dry-run mode" "$log"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  container:
    name: Build, check and publish the runtime container
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      VERSION: ${{ needs.application.outputs.version }}
      REUSE_DIGEST: ${{ needs.application.outputs.reuse_digest }}
      BUILD_SOURCE: ${{ needs.application.outputs.build_source_revision }}
      PRODUCTION_IDENTITY: ${{ needs.application.outputs.production_identity }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout and upstream
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SOURCE_SHA,,}" ]]
          [[ -f Containerfile ]]
          qualification_dir=$(mktemp -d "$RUNNER_TEMP/litellm-qualification.XXXXXXXX")
          set -euo pipefail
          output=$qualification_dir
          index=bc803c88c244d6193b0f40bffad1124c624109513e56332b03c20d121a9546fb
          amd64=ec96da9f0c6286523a1f7646ecc8991c2455fb9b32cd24d19f9d237ff17ce6cf
          arm64=66d944d56370313bcf3bed9bfdee91d7f199122e76b194be460fc8661ba85711
          source=e926084212ab2eb234c58840d741b3c62c35911b
          token=$(curl -q -fsS 'https://ghcr.io/token?scope=repository:berriai/litellm:pull' |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          for ref in "sha256:$index" "sha256:$amd64" "sha256:$arm64" v1.104.0-rc.2; do
            curl -q -fsS --retry 2 --max-time 45 --proto '=https' -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/berriai/litellm/manifests/$ref" -o "$output/${ref#sha256:}.json"
          done
          (
            cd "$output"
            printf '%s  %s\n' "$index" "$index.json" "$index" v1.104.0-rc.2.json \
              "$amd64" "$amd64.json" "$arm64" "$arm64.json" | sha256sum --check
          )
          python3 - "$output/$index.json" "$amd64" "$arm64" <<'PYTHON'
          import json
          import sys

          with open(sys.argv[1]) as file:
              index = json.load(file)
          assert index["mediaType"] == "application/vnd.oci.image.index.v1+json"
          platforms = {d["platform"]["architecture"]: d["digest"]
                       for d in index["manifests"] if d["platform"]["os"] == "linux"}
          assert platforms == {"amd64": "sha256:" + sys.argv[2], "arm64": "sha256:" + sys.argv[3]}
          PYTHON
          curl -q -fsS --retry 2 --max-time 45 --proto '=https' \
            "https://raw.githubusercontent.com/BerriAI/litellm/$source/LICENSE" -o "$output/LiteLLM-LICENSE"
          cmp licenses/LiteLLM-LICENSE "$output/LiteLLM-LICENSE"
          printf 'upstream_version=v1.104.0-rc.2 upstream_source=%s upstream_index=sha256:%s upstream_amd64=sha256:%s upstream_arm64=sha256:%s\n' "$source" "$index" "$amd64" "$arm64"
          printf 'QUALIFICATION_DIR=%s\n' "$qualification_dir" >> "$GITHUB_ENV"

      - name: Assemble the LiteLLM runtime
        id: assemble
        if: ${{ needs.application.outputs.reuse_digest == '' }}
        run: |
          [[ "$BUILD_SOURCE" =~ ^[a-f0-9]{40}$ && "$BUILD_SOURCE" == "$GITHUB_SHA" ]]
          [[ "$PRODUCTION_IDENTITY" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ -n "$VERSION" ]]
          context="$RUNNER_TEMP/runtime"
          mkdir -p "$context/config" "$context/licenses"
          cp Containerfile entrypoint.sh LICENSE "$context/"
          cp config/litellm.yaml "$context/config/"
          cp licenses/LiteLLM-LICENSE licenses/PgBouncer*-COPYRIGHT "$context/licenses/"
          podman --version
          podman build --platform linux/amd64 --format oci --timestamp 0 --omit-history \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$BUILD_SOURCE" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "io.flowai.production-inputs=$PRODUCTION_IDENTITY" \
            --iidfile "$QUALIFICATION_DIR/image.id" --file "$context/Containerfile" "$context"

      - name: Pull the exact retained runtime
        if: ${{ needs.application.outputs.reuse_digest != '' }}
        run: |
          [[ "$REUSE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$BUILD_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PRODUCTION_IDENTITY" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ -n "$VERSION" ]]
          image="ghcr.io/$GITHUB_REPOSITORY@$REUSE_DIGEST"
          auth="$QUALIFICATION_DIR/anonymous.json"
          printf '{}\n' > "$auth"
          podman pull --authfile "$auth" --platform linux/amd64 "$image"
          podman image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" |
            grep -Fx -- "$image" >/dev/null
          podman image inspect --format '{{.Id}}' "$image" > "$QUALIFICATION_DIR/image.id"
          skopeo copy --preserve-digests --src-authfile "$auth" \
            "docker://$image" "oci:$QUALIFICATION_DIR/image"
          printf '%s\n' "$REUSE_DIGEST" > "$QUALIFICATION_DIR/manifest.digest"

      - name: Inspect the selected runtime and its layers
        shell: bash
        run: |
          if [[ -z "$REUSE_DIGEST" ]]; then
            podman push --format oci --compression-format gzip \
              --digestfile "$QUALIFICATION_DIR/manifest.digest" "$(cat "$QUALIFICATION_DIR/image.id")" \
              "oci:$QUALIFICATION_DIR/image"
          fi
          python3 - "$QUALIFICATION_DIR/image" \
            "$QUALIFICATION_DIR/ec96da9f0c6286523a1f7646ecc8991c2455fb9b32cd24d19f9d237ff17ce6cf.json" \
            "$(cat "$QUALIFICATION_DIR/manifest.digest")" <<'PYTHON'
          """Inspect the immutable, unextracted tar streams in the qualification OCI layout."""

          import gzip
          import hashlib
          import io
          import json
          import os
          import pathlib
          import posixpath
          import sys
          import tarfile
          import zipfile

          OCI_MANIFEST = "application/vnd.oci.image.manifest.v1+json"
          SITE = "app/.venv/lib/python3.13/site-packages/"
          MIT_CORE = SITE + "litellm/proxy/"
          PINNED_ARCHIVES = {
              SITE + "dateutil/zoneinfo/dateutil-zoneinfo.tar.gz",
              SITE + "ddtrace/internal/third-party.tar.gz",
              "usr/lib/apk/db/scripts.tar",
              "usr/share/python-wheels/pip-26.2.1-py3-none-any.whl",
          }
          LICENSE_BASE = "usr/share/licenses/flowai-litellm-gateway/"
          NOTICE_FILES = {
              LICENSE_BASE + "LICENSE": "LICENSE",
              LICENSE_BASE + "LiteLLM-LICENSE": "licenses/LiteLLM-LICENSE",
              LICENSE_BASE + "PgBouncer-COPYRIGHT": "licenses/PgBouncer-COPYRIGHT",
              LICENSE_BASE + "PgBouncer-lib-COPYRIGHT": "licenses/PgBouncer-lib-COPYRIGHT",
          }


          def check_path(path):
              if path.startswith("/"):
                  raise ValueError("unexpected absolute archive entry")
              path = posixpath.normpath(path)
              if path == ".." or path.startswith("../"):
                  raise ValueError("archive traversal")
              parts = path.lower().split("/")
              if path == "app/litellm-proxy-extras/dist" or path.startswith("app/litellm-proxy-extras/dist/"):
                  raise ValueError("retained proxy-extras distribution archive")
              if any("enterprise" in part for part in parts):
                  allowed = {
                      MIT_CORE + "enterprise_billing",
                      MIT_CORE + "enterprise_billing/__init__.py",
                      MIT_CORE + "enterprise_billing/billing_metrics.py",
                      MIT_CORE + "example_config_yaml/enterprise_config.yaml",
                  }
                  if path not in allowed:
                      raise ValueError("unexpected enterprise path or link target")
              return path


          def check_nested(path, stream):
              data = stream.read()
              if path.endswith(".whl"):
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      for member in archive.infolist():
                          check_path(member.filename)
                      return len(archive.infolist())
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:*") as archive:
                  for member in archive:
                      check_path(member.name)
                      if member.issym() or member.islnk():
                          check_path(posixpath.normpath(member.linkname.lstrip("/")))
                  return len(archive.getmembers())


          def sha(stream):
              return "sha256:" + hashlib.file_digest(stream, "sha256").hexdigest()


          def checked_blob(root, descriptor):
              digest = descriptor["digest"]
              algorithm, identifier = digest.split(":")
              assert algorithm == "sha256" and len(identifier) == 64
              blob = root / "blobs" / algorithm / identifier
              assert blob.stat().st_size == descriptor["size"]
              with blob.open("rb") as stream:
                  assert sha(stream) == digest, "OCI blob digest mismatch"
              return blob


          def main(root, upstream_path, expected_digest):
              index = json.loads((root / "index.json").read_text())
              descriptor, = index["manifests"]
              assert descriptor["digest"] == expected_digest, "OCI manifest descriptor mismatch"
              assert descriptor["mediaType"] == OCI_MANIFEST
              manifest = json.loads(checked_blob(root, descriptor).read_text())
              config = json.loads(checked_blob(root, manifest["config"]).read_text())
              if os.environ["REUSE_DIGEST"]:
                  assert expected_digest == os.environ["REUSE_DIGEST"], "retained manifest digest mismatch"
              image_id = (root.parent / "image.id").read_text().strip().removeprefix("sha256:")
              assert "sha256:" + image_id == manifest["config"]["digest"], "Podman image ID mismatch"
              labels = config["config"].get("Labels") or {}
              expected_labels = {
                  "org.opencontainers.image.source": "https://github.com/" + os.environ["GITHUB_REPOSITORY"],
                  "org.opencontainers.image.revision": os.environ["BUILD_SOURCE"],
                  "org.opencontainers.image.version": os.environ["VERSION"],
                  "io.flowai.production-inputs": os.environ["PRODUCTION_IDENTITY"],
              }
              for name, value in expected_labels.items():
                  assert labels.get(name) == value, f"OCI label mismatch: {name}"
              upstream = json.loads(upstream_path.read_text())
              upstream_layers = {layer["digest"] for layer in upstream["layers"]}
              assert manifest["mediaType"] == OCI_MANIFEST
              assert (config["os"], config["architecture"]) == ("linux", "amd64")
              runtime = config["config"]
              assert runtime["User"] == "65532:65532" and runtime["WorkingDir"] == "/app"
              assert runtime["Entrypoint"] == ["/usr/local/bin/flowai-litellm-gateway"]
              assert not runtime.get("Cmd")
              assert runtime["ExposedPorts"] == {"4000/tcp": {}}
              assert set(runtime["Env"]) == {
                  "PATH=/app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin",
                  "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt",
                  "PRISMA_BINARY_CACHE_DIR=/opt/prisma/binaries",
                  "PRISMA_CLI_PATH=/opt/prisma/binaries/node_modules/.bin/prisma",
                  "PRISMA_CLI_QUERY_ENGINE_TYPE=binary",
                  "PRISMA_OFFLINE_MODE=true",
                  "HOME=/tmp",
              }
              originals = {
                  "etc/flowai-litellm/litellm.yaml": "config/litellm.yaml",
                  "usr/local/bin/flowai-litellm-gateway": "entrypoint.sh",
                  **NOTICE_FILES,
              }
              verified = set()
              nested = {}
              for layer, diff_id in zip(manifest["layers"], config["rootfs"]["diff_ids"], strict=True):
                  assert layer["digest"] not in upstream_layers
                  assert layer["mediaType"] == "application/vnd.oci.image.layer.v1.tar+gzip"
                  blob = checked_blob(root, layer)
                  with gzip.open(blob, "rb") as stream:
                      assert sha(stream) == diff_id
                  count = links = notices = 0
                  with tarfile.open(blob, "r|gz") as archive:
                      for member in archive:
                          name = check_path(member.name)
                          assert ".wh." not in posixpath.basename(name)
                          count += 1
                          if member.issym():
                              check_path(posixpath.join(posixpath.dirname(name), member.linkname)
                                         if not member.linkname.startswith("/") else member.linkname.lstrip("/"))
                              links += 1
                          if member.islnk():
                              check_path(member.linkname.lstrip("/"))
                              links += 1
                          if not member.isfile():
                              continue
                          if any(word in posixpath.basename(name).lower()
                                 for word in ("license", "licence", "copying", "copyright", "notice")):
                              notices += 1
                          if name in originals:
                              with archive.extractfile(member) as stream, open(originals[name], "rb") as source:
                                  assert sha(stream) == sha(source)
                              verified.add(name)
                          if name.endswith((".tar", ".tar.gz", ".tar.xz", ".tar.bz2", ".tar.zst",
                                            ".tgz", ".whl", ".zip", ".jar", ".7z", ".deb", ".rpm", ".apk")):
                              assert name in PINNED_ARCHIVES
                              with archive.extractfile(member) as stream:
                                  nested[name] = check_nested(name, stream)
                  print(f"layer={layer['digest']} diff_id={diff_id} entries={count} links={links} notices={notices}")
              assert verified == originals.keys()
              assert nested.keys() == PINNED_ARCHIVES
              expected = {descriptor["digest"], manifest["config"]["digest"],
                          *(layer["digest"] for layer in manifest["layers"])}
              actual = {"sha256:" + path.name for path in (root / "blobs" / "sha256").iterdir()}
              assert actual == expected
              print(f"nested_archives={len(nested)} members={sum(nested.values())}")
              print(f"output_platform=linux/amd64 output_media_type={OCI_MANIFEST}")
              print(f"output_config={manifest['config']['digest']} output_manifest={expected_digest}")


          if __name__ == "__main__":
              main(pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), sys.argv[3])
          PYTHON

      - name: Verify the packaged gateway
        shell: bash
        run: |
          # Exercise the packaged FlowAI wrapper against a disposable PostgreSQL dependency.
          set -euo pipefail
          image="$(cat "$QUALIFICATION_DIR/image.id")"
          tmp=$(mktemp -d)
          prefix=flowai-litellm-$(basename "$tmp" | tr -cd '[:alnum:]' | tr '[:upper:]' '[:lower:]')
          network=$prefix-net
          db=$prefix-db
          gateway=$prefix-gateway
          missing=$prefix-missing
          cleanup() {
            local result=$?
            trap - EXIT
            podman rm -f -v --ignore "$gateway" "$db" "$missing" >/dev/null || result=1
            if podman network exists "$network"; then
              podman network rm "$network" >/dev/null || result=1
            fi
            for resource in "$gateway" "$db" "$missing"; do
              if podman container exists "$resource"; then result=1; fi
            done
            if podman network exists "$network"; then result=1; fi
            rm -rf -- "$tmp"
            if [[ "$result" == 0 ]]; then printf 'owned gateway, fixture and network absent\n'; fi
            exit "$result"
          }
          trap cleanup EXIT

          status=0
          podman run --name "$missing" --network none "$image" > "$tmp/missing.log" 2>&1 || status=$?
          [[ "$status" == 64 ]]
          grep -Fxq 'flowai-litellm-gateway: required input LITELLM_MASTER_KEY is missing' "$tmp/missing.log"
          printf 'missing input rejected with exit 64\n'
          umask 077
          python3 - "$tmp" "$db" <<'PYTHON'
          import pathlib
          import secrets
          import sys

          directory = pathlib.Path(sys.argv[1])
          password, master, salt = (secrets.token_hex(24) for _ in range(3))
          (directory / "postgres.env").write_text(
              f"POSTGRES_USER=flowai\nPOSTGRES_PASSWORD={password}\nPOSTGRES_DB=flowai\n"
          )
          (directory / "gateway.env").write_text(
              f"DATABASE_URL=postgresql://flowai:{password}@{sys.argv[2]}:5432/flowai\n"
              f"LITELLM_MASTER_KEY=sk-{master}\nLITELLM_SALT_KEY={salt}\n"
              "LITELLM_LOCAL_MODEL_COST_MAP=true\n"
          )
          PYTHON
          podman network create --internal "$network" >/dev/null
          podman run -d --name "$db" --network "$network" --env-file "$tmp/postgres.env" \
            docker.io/library/postgres@sha256:a85daf0dbd5e79586e850e3fe4b21b796799828ad015ce2166aeb98cc24da61c \
            >/dev/null
          # Expand positional parameters in the timeout subprocess.
          # shellcheck disable=SC2016
          timeout 60 bash -c 'until podman exec "$1" pg_isready -h 127.0.0.1 -U flowai -d flowai >/dev/null 2>&1; do sleep 1; done' _ "$db"

          start() {
            podman run -d --name "$gateway" --network "$network" --env-file "$tmp/gateway.env" "$image" >/dev/null
          }
          probe() {
            for ((attempt = 0; attempt < 100; attempt++)); do
              if podman exec -i "$gateway" python -B - "$1" > "$tmp/probe.log" 2>&1 <<'PYTHON'
          import json
          import os
          import sys
          import urllib.request

          assert (os.getuid(), os.getgid()) == (65532, 65532)
          headers = {"Authorization": "Bearer " + os.environ["LITELLM_MASTER_KEY"],
                     "Content-Type": "application/json"}


          def request(path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("http://127.0.0.1:4000" + path, data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=3) as response:
                  return json.load(response)


          assert request("/health/readiness")["db"] == "connected"
          alias = "flowai-package-qualification"
          if sys.argv[1] == "create":
              request("/model/new", {
                  "model_name": alias,
                  "litellm_params": {"model": "openai/flowai-package-qualification"},
                  "model_info": {"flowai_model_id": 42},
              })
          else:
              models = request("/model/info")["data"]
              assert any(model["model_name"] == alias and model["model_info"]["flowai_model_id"] == 42
                         for model in models)
          PYTHON
              then return 0; fi
              if [[ "$(podman inspect --format '{{.State.Running}}' "$gateway")" != true ]]; then break; fi
              sleep 2
            done
            printf 'Packaged gateway did not pass the %s probe.\n' "$1" >&2
            return 1
          }
          start
          probe create
          printf 'nonroot startup, database-backed readiness and FlowAI model write passed\n'
          podman rm -f -v "$gateway" >/dev/null
          start
          probe read
          printf 'FlowAI model metadata survived gateway recreation\n'

      - name: Publish the tested immutable version
        id: publish
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          umask 077
          state="$(mktemp -d "$RUNNER_TEMP/registry.XXXXXX")"
          image="ghcr.io/$GITHUB_REPOSITORY"
          scope="scope=repository:$GITHUB_REPOSITORY:pull"
          media='application/vnd.oci.image.manifest.v1+json'
          lookup() {
            printf 'header = "Authorization: Bearer %s"\n' "$1" |
              curl -q --config - -sS --max-time 30 -H "Accept: $media" \
                -o "$state/manifest" -w '%{http_code}' "https://ghcr.io/v2/$GITHUB_REPOSITORY/manifests/$2"
          }
          check_digest() {
            printf '%s  %s\n' "${digest#sha256:}" "$state/manifest" | sha256sum --check
          }
          digest="$(cat "$QUALIFICATION_DIR/manifest.digest")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          if [[ -n "$REUSE_DIGEST" ]]; then
            [[ "$digest" == "$REUSE_DIGEST" ]]
          else
            token="$(printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" |
              curl -q --config - -fsS --max-time 30 --get https://ghcr.io/token \
                --data-urlencode service=ghcr.io --data-urlencode "$scope,push" | jq -er .token)"
            [[ "$token" =~ ^[A-Za-z0-9_.=+/-]+$ ]]
            printf '::add-mask::%s\n' "$token"
            status="$(lookup "$token" "$VERSION")"
            case "$status" in
              200) check_digest ;;
              404)
                absent() {
                  jq -e '(.errors | length) == 1 and (.errors[0].code | IN("MANIFEST_UNKNOWN", "NAME_UNKNOWN"))' "$state/manifest" >/dev/null
                }
                absent
                printf '%s\n' "$GHCR_TOKEN" | podman login --authfile "$state/auth.json" ghcr.io \
                  --username "$GITHUB_ACTOR" --password-stdin
                [[ "$(lookup "$token" "$VERSION")" == 404 ]]
                absent
                skopeo copy --preserve-digests --dest-authfile "$state/auth.json" \
                  "oci:$QUALIFICATION_DIR/image" "docker://$image:$VERSION"
                ;;
              *) exit 1 ;;
            esac
          fi

          public="$(curl -q -fsS --max-time 30 --get https://ghcr.io/token \
            --data-urlencode service=ghcr.io --data-urlencode "$scope" | jq -er .token)"
          [[ "$public" =~ ^[A-Za-z0-9_.=+/-]+$ ]]
          printf '::add-mask::%s\n' "$public"
          for locator in "$VERSION" "$digest"; do
            [[ "$(lookup "$public" "$locator")" == 200 ]]
            check_digest
          done
          if [[ -z "$REUSE_DIGEST" ]]; then
            printf '{}\n' > "$state/anonymous.json"
            podman pull --authfile "$state/anonymous.json" --platform linux/amd64 "$image@$digest"
          fi
          printf 'image_ref=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"

      - name: Record the stable semantic-release version
        if: ${{ github.ref_name == 'master' && needs.application.outputs.reuse_digest == '' }}
        env:
          VERSION: ${{ needs.application.outputs.version }}
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
          PRODUCTION_IDENTITY: ${{ needs.application.outputs.production_identity }}
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PRODUCTION_IDENTITY" =~ ^sha256:[a-f0-9]{64}$ ]]
          url="https://github.com/$GITHUB_REPOSITORY.git"
          tag="v$VERSION"
          target="$(git rev-parse "$GITHUB_SHA^{commit}")"
          [[ "$IMAGE_REF" =~ @sha256:[a-f0-9]{64}$ ]]
          record="$(jq -cn --arg repository "$GITHUB_REPOSITORY" --arg source "$target" \
            --arg version "$VERSION" --arg digest "${IMAGE_REF#*@}" --arg identity "$PRODUCTION_IDENTITY" '
            {schema:1,stage:"stable",repository:$repository,version:$version,
             buildSourceRevision:$source,imageDigest:$digest,productionIdentity:$identity}')"
          if git fetch --quiet --no-tags "$url" "refs/tags/$tag" 2> "$RUNNER_TEMP/release-tag-fetch.log"; then
            [[ "$(git rev-parse "FETCH_HEAD^{commit}")" == "$target" ]]
            [[ "$(git cat-file -t FETCH_HEAD)" == tag ]]
            [[ "$(git cat-file tag FETCH_HEAD | sed '1,/^$/d')" == "$record" ]]
          else
            grep -Fq "couldn't find remote ref refs/tags/$tag" "$RUNNER_TEMP/release-tag-fetch.log"
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              tag -a -m "$record" "$tag" "$target"
            auth="$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w 0)"
            printf '::add-mask::%s\n' "$auth"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
              git push "$url" "refs/tags/$tag:refs/tags/$tag"
          fi

      - name: Emit qualification receipt
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: |
          workflow="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}"
          workflow="${workflow%@*}"
          build=success
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg source "$GITHUB_SHA" \
            --arg built "$BUILD_SOURCE" --arg version "$VERSION" --arg digest "${IMAGE_REF#*@}" \
            --arg workflow "$workflow" --argjson run "$GITHUB_RUN_ID" --arg build "$build" '
            {schema:1,repository:$repository,sourceRevision:$source,buildSourceRevision:$built,
             version:$version,imageDigest:$digest,schemaInputs:[],workflowPath:$workflow,
             runId:$run,outcomes:{unit:"not-applicable",integration:"not-applicable",build:$build}}
          ' > "$RUNNER_TEMP/qualification.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: error
